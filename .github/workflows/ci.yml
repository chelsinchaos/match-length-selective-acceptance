#
# Runs when this directory is the root of its own repository (the public
# release). Inside the larger private repository it is inert.
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the record tests read the order of commits
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Locked environment
        run: |
          python -m pip install -r requirements.lock --extra-index-url https://download.pytorch.org/whl/cpu
          python -c "import nltk; nltk.download('punkt_tab', quiet=True)"
      - name: Pinned calibrator
        run: python scripts/fetch_selcert.py
      - name: Tests
        run: python -m pytest -q
      - name: Smoke experiment
        run: python scripts/smoke.py
